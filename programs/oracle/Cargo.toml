[package]
name = "oracle"
version = "0.1.0"
description = "Oracle program"
edition.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "oracle"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"

[dev-dependencies]
litesvm = "=0.7.1"
solana-sdk = "2.1.0"
solana-message = "2"
solana-transaction = "2"
solana-signer = "2"
solana-keypair = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
