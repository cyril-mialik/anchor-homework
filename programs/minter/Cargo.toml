[package]
name = "minter"
version = "0.1.0"
description = "Minter program"
edition.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "minter"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.2.0"
anchor-spl = "=1.2.0"

[dev-dependencies]
litesvm = "0.11.0"
solana-sdk = "~3.0"
solana-message = "=2.4.0"
solana-transaction = "=2.2.3"
solana-signer = "=2.2.1"
solana-keypair = "=2.2.3"
solana-address = "2"
spl-token = "=8.0.0"
spl-associated-token-account = "=7.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
